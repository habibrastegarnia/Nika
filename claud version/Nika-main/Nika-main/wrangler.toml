name = "nika-homepage"
main = "src/index.js"
compatibility_date = "2026-11-14"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nika-db"
database_id = "9247f224-c409-4ac5-8f38-2ffd866b9178"
migrations_dir = "migrations"

[triggers]
crons = ["30 4 * * *"]

[vars]
ENVIRONMENT = "production"
# فقط برای ساختمان‌های کوچک که یک نفر هم ثبت‌کننده و هم تأییدکننده است؛ به‌صورت پیش‌فرض ممنوع.
ALLOW_SELF_APPROVAL = "false"
# رمز اولیه‌ی مالک/ساکن: "random" (پیش‌فرض، امن) یا "phone" (رمز اولیه = شماره موبایل؛ قبل از فعال‌سازی قابل حدس است)
INITIAL_PASSWORD_MODE = "random"

[observability]
enabled = true

