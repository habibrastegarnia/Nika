<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>راه‌اندازی مدیر اصلی نیکا</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#202833}
main{max-width:460px;margin:30px auto;background:white;padding:24px;border-radius:14px;box-shadow:0 4px 24px #0001}
h2{font-size:20px;margin-top:0}p{line-height:1.9;color:#596575;font-size:14px}
label{display:block;margin:16px 0 7px;font-size:14px}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:8px;font:inherit}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#16794b;color:white;font:inherit;cursor:pointer}
button:disabled{opacity:.6}
#result{white-space:pre-wrap;line-height:1.9;margin-top:16px;font-size:14px}
</style>
</head>
<body><main>
<h2>ایجاد حساب رئیس هیئت‌مدیره</h2>
<p>این فرم فقط برای راه‌اندازی اولیه است. کلید راه‌اندازی و رمز عبور را در اختیار هیچ‌کس قرار ندهید. اطلاعات مستقیماً به سرور همین سامانه ارسال می‌شود.</p>
<form id="setup" novalidate>
<label>نام و نام خانوادگی</label><input name="name" maxlength="100" autocomplete="name">
<label>شماره موبایل</label><input name="phone" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxxx">
<label>رمز عبور مدیر اصلی</label><input name="password" type="password" minlength="10" autocomplete="new-password">
<label>کلید راه‌اندازی (BOOTSTRAP_KEY)</label><input name="key" type="password" autocomplete="off">
<button id="submit" type="submit">ایجاد حساب مدیر اصلی</button>
</form><div id="result" role="status">فرم آماده است. اطلاعات را وارد کنید.</div>
</main>
<script>
(function(){
 var form=document.getElementById('setup');
 var button=document.getElementById('submit');
 var out=document.getElementById('result');
 form.addEventListener('submit',function(e){
  e.preventDefault();
  var name=form.elements.name.value.trim();
  var phone=form.elements.phone.value.trim();
  var password=form.elements.password.value;
  var key=form.elements.key.value;
  if(!name||!phone||!password||!key){out.textContent='لطفاً هر چهار قسمت را کامل کنید.';return;}
  if(password.length<10){out.textContent='رمز عبور باید حداقل ۱۰ کاراکتر باشد.';return;}
  button.disabled=true;
  out.textContent='در حال ارسال درخواست به سرور...';
  var xhr=new XMLHttpRequest();
  xhr.open('POST','/api/setup',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('X-Setup-Key',key);
  xhr.timeout=20000;
  xhr.onload=function(){
   var message=xhr.responseText||'پاسخ خالی از سرور';
   try{
    var data=JSON.parse(xhr.responseText);
    message=data.message||data.error||message;
    if(data.error)message+=' ('+data.error+')';
   }catch(ignore){}
   out.textContent=(xhr.status>=200&&xhr.status<300?'موفقیت: ':'خطای سرور ('+xhr.status+'): ')+message;
   if(xhr.status>=200&&xhr.status<300)form.reset();
   button.disabled=false;
  };
  xhr.onerror=function(){out.textContent='خطای ارتباط با سرور؛ درخواست ارسال نشد یا پاسخ دریافت نشد.';button.disabled=false;};
  xhr.ontimeout=function(){out.textContent='پاسخ سرور بیش از ۲۰ ثانیه طول کشید. وضعیت را بررسی می‌کنیم؛ فعلاً دوباره ارسال نکنید.';button.disabled=false;};
  try{xhr.send(JSON.stringify({name:name,phone:phone,password:password}));}
  catch(err){out.textContent='خطا هنگام ارسال: '+err.message;button.disabled=false;}
 });
})();
</script></body></html>
