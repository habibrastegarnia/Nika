<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فعال‌سازی اولیه نیکا</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#202833}
main{max-width:460px;margin:30px auto;background:white;padding:24px;border-radius:14px;box-shadow:0 4px 24px #0001}
h2{font-size:20px;margin-top:0}p{line-height:1.9;color:#596575;font-size:14px}
label{display:block;margin:16px 0 7px;font-size:14px}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:8px;font:inherit}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#16794b;color:white;font:inherit;cursor:pointer}
button:disabled{opacity:.6}
#result{white-space:pre-wrap;line-height:1.9;margin-top:16px;font-size:14px}
</style>
</head>
<body><main>
<h2>فعال‌سازی اولیه سامانه نیکا</h2>
<p>این مرحله فقط یک‌بار و فقط پیش از ایجاد اولین کاربر انجام می‌شود. پس از فعال‌سازی، با نام کاربری Admin و رمز موقت admin وارد شوید و رمز را تغییر دهید.</p>
<form id="setup" novalidate>
<label for="key">کلید فعال‌سازی امن (BOOTSTRAP_KEY)</label><input id="key" name="key" type="password" autocomplete="off" required>
<button id="submit" type="submit">فعال‌سازی و ایجاد مدیر اصلی</button>
</form><div id="result" role="status">برای ایجاد حساب مدیر اصلی، کلید فعال‌سازی را وارد کنید.</div>
</main>
<script src="/js/setup.js" defer></script></body></html>
