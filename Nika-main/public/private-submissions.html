<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f7f5">
<title>فهرست ثبت‌نام‌ها | نیکا</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#24372c;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:32px auto;padding:0 16px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.brand{font-size:20px;font-weight:700}.sub{font-size:12px;color:#718078;margin-top:7px}.count{background:#e5f1e9;color:#246343;padding:12px 16px;border-radius:12px;font-weight:bold}.panel{background:white;border:1px solid #e4ebe6;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px #203c2b0b}.status{padding:13px 16px;color:#718078;font-size:12px;border-bottom:1px solid #edf1ed}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{padding:13px 12px;text-align:right;border-bottom:1px solid #edf1ed}th{background:#f8faf8;color:#53665a;font-size:12px}tbody tr:last-child td{border-bottom:0}.empty{padding:34px;text-align:center;color:#819087}.error{color:#a43b35}.muted{color:#849188;font-size:11px}.refresh{font-size:11px;color:#849188;margin-top:12px;text-align:left}@media(max-width:600px){.wrap{margin:20px auto}.brand{font-size:17px}th,td{padding:11px 10px;font-size:12px}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div><div class="brand">ساختمان نیکا | فهرست ثبت‌نام‌ها</div><div class="sub">اطلاعات ثبت‌شده در فرم مالکان و ساکنان</div></div><div class="count" id="count">در حال دریافت اطلاعات…</div></header>
<section class="panel"><div class="status" id="status">در حال اتصال به پایگاه داده…</div><div class="table-wrap"><table><thead><tr><th>ردیف</th><th>واحد</th><th>نوع کاربر</th><th>نام و نام خانوادگی</th><th>جنسیت</th><th>شماره تماس</th><th>تماس پشتیبان</th><th>شروع قرارداد</th><th>پایان قرارداد</th><th>زمان ثبت</th></tr></thead><tbody id="rows"><tr><td colspan="10" class="empty">در حال بارگذاری…</td></tr></tbody></table></div></section>
<div class="refresh">برای دریافت اطلاعات تازه، صفحه را به‌صورت دستی رفرش کنید.</div>
</main><script src="/js/private-submissions.js" defer></script></body></html>
