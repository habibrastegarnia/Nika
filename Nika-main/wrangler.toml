name = "nika-homepage"
main = "src/index.js"
compatibility_date = "2026-11-14"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nika-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
# فقط برای ساختمان‌های کوچک که یک نفر هم ثبت‌کننده و هم تأییدکننده است؛ به‌صورت پیش‌فرض ممنوع.
ALLOW_SELF_APPROVAL = "false"

[observability]
enabled = true
