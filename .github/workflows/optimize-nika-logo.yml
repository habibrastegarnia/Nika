name: Optimize Nika logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert transparent PNG to WebP
        run: |
          npm install --no-save sharp
          node -e "const sharp=require('sharp'); sharp('Nika-main/public/assets/nika-logo-transparent-640.png').resize(256,256,{fit:'inside',withoutEnlargement:true}).webp({quality:78,alphaQuality:85,effort:6}).toFile('Nika-main/public/assets/nika-logo.webp').then(i=>console.log(i))"
      - name: Commit optimized logo
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Nika-main/public/assets/nika-logo.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize transparent Nika logo as WebP"
            git pull --rebase origin main
            git push
          fi
