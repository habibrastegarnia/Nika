name: Verify Nika
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: Nika-main
        run: npm install --no-audit --no-fund
      - name: Run API tests
        working-directory: Nika-main
        run: npm test
      - name: Check browser JavaScript syntax
        working-directory: Nika-main
        run: find public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check standalone offline viewer script
        working-directory: Nika-main
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const html=fs.readFileSync('public/offline-archive.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if(scripts.length!==1) throw new Error('Expected one standalone script'); fs.writeFileSync('/tmp/nika-offline-archive-check.js',scripts[0][1]);"
          node --check /tmp/nika-offline-archive-check.js
