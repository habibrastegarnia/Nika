name: Verify Nika
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: Nika-main
        run: npm install --no-audit --no-fund
      - name: Run API tests
        working-directory: Nika-main
        run: npm test
      - name: Check browser JavaScript syntax
        working-directory: Nika-main
        run: find public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
