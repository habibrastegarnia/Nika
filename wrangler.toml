# Root-level fallback for Cloudflare Workers Builds branch previews.
# Cloudflare's auto-created preview trigger currently runs from repository root
# and may ignore the configured monorepo Root directory.
# Keep this preview-only config isolated from the production config in Nika-main/.
name = "nika-homepage"
main = "Nika-main/src/index.js"
compatibility_date = "2026-11-14"
previews = {}

[assets]
directory = "Nika-main/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Intentionally no D1 binding here: preview must not connect to production data.
# Add a dedicated staging D1 binding under [previews.d1_databases] after provisioning it.
